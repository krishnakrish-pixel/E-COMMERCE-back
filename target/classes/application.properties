spring.application.name=shophub-backend
server.port=8080

# ---------- MySQL ----------
# The database is created automatically if it does not exist.
# CHANGE the username / password to match your local MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/shophub_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "update" creates / updates the tables automatically on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Must be at least 32 characters. Override with the JWT_SECRET env variable in production.
shophub.jwt.secret=${JWT_SECRET:shophub-dev-secret-key-change-me-please-0123456789}
shophub.jwt.expiration-ms=86400000

# ---------- CORS (React frontend) ----------
shophub.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# ---------- Seed data (created on first start only) ----------
shophub.admin.email=admin@shophub.com
shophub.admin.password=${ADMIN_PASSWORD:admin123}
shophub.demo.email=demo@shophub.com
shophub.demo.password=demo123

# ---------- Admin analytics ----------
# Time zone used to group sales into days on the dashboard
shophub.stats.zone=Asia/Kolkata
